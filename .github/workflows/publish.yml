name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing requires npm 11.5.1 or newer.
      # Match the CLI whose pack JSON and consumer checks we validate locally.
      - run: npm install --global npm@11.20.0

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            const tag = process.env.RELEASE_TAG;
            if (tag !== `v${packageJson.version}`) {
              throw new Error(`${tag} does not match package.json version ${packageJson.version}`);
            }
          '

      - run: npm ci
      - run: npm run release:check

      # release:check already builds and validates the package. OIDC trusted
      # publishing generates provenance automatically and needs no npm token.
      - run: npm publish --ignore-scripts
