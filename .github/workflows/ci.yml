name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run release:check
      # The published ESM package supports Node 18 consumers, so test
      # consumption separately after build.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm run pack:check

  website:
    runs-on: ubuntu-latest
    env:
      # Build and test under the production base path.
      DOCS_BASE_PATH: /visdelta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      # Lint, strict types, example verification, production build, then
      # browser tests against the exported site.
      - run: npm run check
        working-directory: website
