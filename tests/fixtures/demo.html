<html lang="en"><head><meta charset="utf-8">
<script type="importmap">

        "d3-axis": "/tests/fixtures/d3-axis-global.js",
        "d3-color": "/tests/fixtures/d3-color-global.js",
        "d3-dsv": "/tests/fixtures/d3-dsv-global.js",
        "d3-ease": "/tests/fixtures/d3-ease-global.js",
        "d3-fetch": "/tests/fixtures/d3-fetch-global.js",
        "d3-force": "/tests/fixtures/d3-force-global.js",
        "d3-format": "/tests/fixtures/d3-format-global.js",
        "d3-interpolate": "/tests/fixtures/d3-interpolate-global.js",
        "d3-scale": "/tests/fixtures/d3-scale-global.js",
        "d3-selection": "/tests/fixtures/d3-selection-global.js",
        "d3-shape": "/tests/fixtures/d3-shape-global.js",

      } }
    </script>
  
<script src="/node_modules/d3/dist/d3.min.js"></script>
<link rel="stylesheet" href="/dist/visdelta.css">
<style>
  html, body { margin: 0; background: #fff; font: 13px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #333; }
  #wrap { width: 760px; padding: 14px 20px 12px; box-sizing: border-box; }
  #chart { width: 720px; }
  /* The shell's empty figure header and card chrome add nothing to a README frame. */
  #chart .vd-figure-header { display: none; }
  #chart .vd-figure { background: none; border: 0; box-shadow: none; backdrop-filter: none; }
  #chart .vd-view { min-height: 0; }
  #bar { position: relative; height: 40px; margin-top: 14px; }
  #track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: #e6e6e6; border-radius: 2px; }
  #fill { position: absolute; left: 0; top: 11px; height: 4px; background: #333; border-radius: 2px; width: 0; }
  #knob { position: absolute; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid #333; box-sizing: border-box; margin-left: -8px; }
  #label { position: absolute; left: 0; top: -14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #666; }
  #ticks span { position: absolute; top: 18px; font-size: 11px; color: #888; transform: translateX(-50%); }
</style></head>
<body><div id="wrap">
  <div id="chart"></div>
  <div id="bar"><div id="track"></div><div id="fill"></div><div id="knob"></div><div id="label"></div>
    <div id="ticks"><span style="left:0%">rollup</span><span style="left:50%">breakdown</span><span style="left:100%">grouped</span></div></div>
</div>
<script type="module">
  import { bar } from '/dist/bar.js';
  import { sequence } from '/dist/transition-entry.js';
  const AGE_BANDS = ["<10", "10-19", "20-29", "30-39", "40-49", "50-59", "60-69", "70-79", "≥80"];
  const AGE_COLORS = ["#d53e4f", "#f46d43", "#fdae61", "#fee08b", "#ffffbf", "#e6f598", "#abdda4", "#66c2a5", "#3288bd"];
  const STATES = ["CA", "TX", "FL", "NY", "PA", "IL"];
  const detailed = bar({ url: "/docs/public/data/us-population-state-age-tidy.csv" })
    .x("state", { title: "State" })
    .y("population", { title: "Population", format: "~s" })
    .key(["state", "age"])
    .where({ field: "state", oneOf: STATES })
    .breakdown("age")
    .color("age", { domain: AGE_BANDS, range: AGE_COLORS });
  const seq = await sequence([detailed.rollup(), detailed, detailed.layout("grouped")], { target: "#chart", height: 330 });
  window.seek = (t) => {
    seq.progress(t);
    const pct = (t / 2) * 100;
    document.querySelector('#fill').style.width = pct + '%';
    document.querySelector('#knob').style.left = pct + '%';
    document.querySelector('#label').textContent = 'progress(' + t.toFixed(2) + ')';
  };
  window.seek(0);
  window.ready = true;
</script></body></html>
