<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VisDelta browser test fixture</title>
    <link rel="stylesheet" href="/dist/visdelta.css">
    <script type="importmap">
      { "imports": { "d3": "/tests/fixtures/d3-global.js", "arquero": "/tests/fixtures/arquero-global.js" } }
    </script>
  </head>
  <body>
    <span id="status">Loading</span>
    <div id="chart"></div>
    <label>Progress <input id="progress" type="range" min="0" max="1" step="0.01" value="0"></label>
    <output id="value">0.00</output>
    <script src="/node_modules/d3/dist/d3.min.js"></script>
    <script src="/node_modules/arquero/dist/arquero.min.js"></script>
    <script src="/dist/visdelta.global.js"></script>
    <script>
      (async () => {
      const { bar, transition } = VisDelta;

      const rows = [
        { category: 'A', value: 10, other: 35, type: 'one' },
        { category: 'B', value: 30, other: 5, type: 'two' },
        { category: 'C', value: 20, other: 15, type: 'one' }
      ];
      const from = bar(rows).x('category').y('value').key('category');
      const change = await transition(from, from.y('other'), {
        target: '#chart', d3, aq, height: 400
      });
      const progress = document.querySelector('#progress');
      const value = document.querySelector('#value');
      progress.addEventListener('input', () => {
        change.progress(progress.valueAsNumber);
        value.value = progress.valueAsNumber.toFixed(2);
      });
      document.querySelector('#status').textContent = 'Ready';
      })();
    </script>
  </body>
</html>
