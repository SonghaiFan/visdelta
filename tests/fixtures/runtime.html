<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VisDelta browser test fixture</title>
    <link rel="stylesheet" href="/dist/visdelta.css">
    <script type="importmap">
      { "imports": {
        "d3-array": "/tests/fixtures/d3-array-global.js",
        "d3-axis": "/tests/fixtures/d3-axis-global.js",
        "d3-color": "/tests/fixtures/d3-color-global.js",
        "d3-dsv": "/tests/fixtures/d3-dsv-global.js",
        "d3-ease": "/tests/fixtures/d3-ease-global.js",
        "d3-fetch": "/tests/fixtures/d3-fetch-global.js",
        "d3-force": "/tests/fixtures/d3-force-global.js",
        "d3-format": "/tests/fixtures/d3-format-global.js",
        "d3-interpolate": "/tests/fixtures/d3-interpolate-global.js",
        "d3-scale": "/tests/fixtures/d3-scale-global.js",
        "d3-selection": "/tests/fixtures/d3-selection-global.js",
        "d3-shape": "/tests/fixtures/d3-shape-global.js",
        "d3-timer": "/tests/fixtures/d3-timer-global.js",
        "d3-transition": "/tests/fixtures/d3-transition-global.js"
      } }
    </script>
  </head>
  <body>
    <span id="status">Loading</span>
    <div id="chart"></div>
    <label>Progress <input id="progress" type="range" min="0" max="1" step="0.01" value="0"></label>
    <output id="value">0.00</output>
    <script src="/node_modules/d3/dist/d3.min.js"></script>
    <script src="/dist/visdelta.global.js"></script>
    <script>
      (async () => {
      const { bar, transition } = VisDelta;

      const rows = [
        { category: 'A', value: 10, other: 35, type: 'one' },
        { category: 'B', value: 30, other: 5, type: 'two' },
        { category: 'C', value: 20, other: 15, type: 'one' }
      ];
      const from = bar(rows).x('category').y('value').key('category');
      const change = await transition(from, from.y('other'), {
        target: '#chart', height: 400
      });
      const progress = document.querySelector('#progress');
      const value = document.querySelector('#value');
      progress.addEventListener('input', () => {
        change.progress(progress.valueAsNumber);
        value.value = progress.valueAsNumber.toFixed(2);
      });
      document.querySelector('#status').textContent = 'Ready';
      })();
    </script>
  </body>
</html>
